<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des élèves</title>
    <link rel="stylesheet" href="./mon-espace-dashboard-admin.component.css">
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <img src="logo.png" alt="Easy 2 Drive Admin">
        </div>
        <button class="dashboard-btn">Dashboard</button>
        <button class="logout-btn" (click)="logout()">🚪 Déconnexion</button>
    </div>

    <div class="content">
        <div class="header">
            <h2>Gestion des élèves</h2>
            <button class="add-btn" (click)="ouvrirModal()">Ajouter un élève</button>
        </div>
    
        <div class="dashboard-container">
            <h1>Gestion des élèves</h1>

            <table>
            <thead>
                <tr>
                <th>Nom</th>
                <th>Prénom</th>
                <th>NEPH</th>
                <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let eleve of eleves">
                <td>{{ eleve.Nom }}</td>
                <td>{{ eleve.Prenom }}</td>
                <td>{{ eleve.NEPH_Email }}</td>
                <td>
                    <button (click)="afficherDetails(eleve)">Voir détails</button>
                </td>
                </tr>
            </tbody>
            </table>
        </div>
    </div>
    
    <div class="modal" *ngIf="isModalOpen">
        <div class="modal-content">
            <div class="modal-header">
                <h2>{{ isEditing ? 'Modifier' : 'Ajouter' }} un élève</h2>
                <span (click)="fermerModal()" class="close-btn">&times;</span>
            </div>
    
            <input type="text" [(ngModel)]="eleveForm.nom" placeholder="Nom">
            <input type="text" [(ngModel)]="eleveForm.prenom" placeholder="Prénom">
            <input type="text" [(ngModel)]="eleveForm.neph_email" placeholder="NEPH_Email">
            <input type="text" [(ngModel)]="eleveForm.auto_ecole" placeholder="Auto-école">
            <input type="date" [(ngModel)]="eleveForm.jour_inscription" placeholder="Jour d'inscription">
            <div class="code-container">
                <input [type]="isCodeVisible ? 'text' : 'password'" [(ngModel)]="eleveForm.code" placeholder="Code">
                <button type="button" (click)="toggleCodeVisibility()">👁</button>
            </div>
    
            <button id="validateButton" (click)="validerEleve()">Valider</button>
        </div>
    </div>
</body>
</html>
