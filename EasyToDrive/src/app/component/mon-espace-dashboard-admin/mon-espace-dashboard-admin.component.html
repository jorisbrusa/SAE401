<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des élèves - Easy 2 Drive Admin</title>
    <link rel="stylesheet" href="./mon-espace-dashboard-admin.component.css">
</head>
<body>
    <div class="sidebar">
        <img src="logo.png" alt="Easy 2 Drive Admin">
        <div class="menu">Dashboard</div>
    </div>
    <div class="content">
        <div class="header">
            <h2>Gestion des élèves</h2>
            <button class="btn-add" onclick="openModal()">Ajouter un élève</button>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>NEPH</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Les lignes des élèves seront ajoutées ici -->
                </tbody>
            </table>
        </div>
    </div>
    <div class="modal" id="modal">
        <div class="modal-content">
            <h3>Ajouter un élève</h3>
            <input type="text" placeholder="Nom" id="nom">
            <input type="text" placeholder="Prénom" id="prenom">
            <input type="text" placeholder="NEPH" id="neph">
            <input type="date" id="date_naissance">
            <input type="email" placeholder="Adresse mail" id="email">
            <input type="password" placeholder="Mot de passe" id="password">
            <button onclick="ajouterEleve()">Valider</button>
        </div>
    </div>
    
</body>
</html>
